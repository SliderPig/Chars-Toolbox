plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

// 0.x while the parts are being built one build-order step at a time; 1.0 is the first version with all 15 parts.
version = '1.3'
group = 'com.example.chartoolbox'

base {
    archivesName = 'chartoolbox'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            mods {
                chartoolbox {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.named('jar', Jar) {
    // The mods the Toolbox carries (Forge jar-in-jar). tools/collect_parts.py fills parts/ first.
    from('parts') {
        include '*.jar', 'metadata.json'
        into 'META-INF/jarjar'
    }
    manifest {
        attributes([
            'Specification-Title'   : 'chartoolbox',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.jar.archiveVersion
        ])
    }
}
